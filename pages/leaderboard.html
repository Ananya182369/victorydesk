<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VictoryDesk | Leaderboard</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="top-banner">
🏆 VictoryDesk Leaderboard
</div>

<header>

<h1>🏆 Leaderboard</h1>

<p class="hero-text">
See your study progress and XP.
</p>

<a href="dashboard.html" class="btn">
⬅ Dashboard
</a>

</header>

<section class="container">

<div class="card">

<h2>🌟 Your Ranking</h2>

<p id="playerCount">
👥 0 Players
</p>

<div class="your-rank-summary">

<h3>🏆 Your Current Rank</h3>

<p id="yourXP">
⭐ XP: 0
</p>

<p id="yourLevel">
🏅 Level: Beginner
</p>

<p id="rankTier">
📊 Rank Tier: —
</p>

<p id="xpToNext">
🎯 XP to next rank: —
</p>

<p id="yourRank">
Calculating...
</p>

</div>

<div id="leaderboardList">

<p>Loading leaderboard...</p>

</div>

</div>

</section>

<script>

let xp =
Number(localStorage.getItem("xp")) || 0;

let level = "Beginner";

if(xp >= 2000){
    level = "Master";
}
else if(xp >= 1000){
    level = "Expert";
}
else if(xp >= 500){
    level = "Intermediate";
}
else if(xp >= 100){
    level = "Starter";
}

const leaderboard = [
{
    name: "You",
    xp: xp,
    level: level
},
{
    name: "Study Master",
    xp: 850,
    level: "Intermediate"
},
{
    name: "Topper Pro",
    xp: 650,
    level: "Intermediate"
},
{
    name: "Future Doctor",
    xp: 420,
    level: "Starter"
},
{
    name: "Dream Chaser",
    xp: 180,
    level: "Starter"
}
];

leaderboard.sort((a,b) => b.xp - a.xp);

document.getElementById("playerCount").textContent =
"👥 " + leaderboard.length + " Players";

const yourRank =
leaderboard.findIndex(player => player.name === "You") + 1;

document.getElementById("yourXP").textContent =
"⭐ XP: " + xp;

document.getElementById("yourLevel").textContent =
"🏅 Level: " + (
    level === "Master" ? "👑 Master" :
    level === "Expert" ? "🏆 Expert" :
    level === "Intermediate" ? "🥇 Intermediate" :
    level === "Starter" ? "🌟 Starter" :
    "🌱 Beginner"
);

document.getElementById("yourRank").textContent =
`#${yourRank} out of ${leaderboard.length} players`;

let rankTier = "";

if(yourRank === 1){
    rankTier = "🥇 Top 1";
}
else if(yourRank === 2){
    rankTier = "🥈 Top 2";
}
else if(yourRank === 3){
    rankTier = "🥉 Top 3";
}
else if(yourRank <= 10){
    rankTier = "⭐ Top 10";
}
else{
    rankTier = "📚 Keep Practicing";
}

document.getElementById("rankTier").textContent =
"📊 Rank Tier: " + rankTier;

if(yourRank === 1){

    document.getElementById("xpToNext").textContent =
    "👑 You are #1 — Keep leading!";

}
else{

    const playerAbove =
    leaderboard[yourRank - 2];

    const xpNeeded =
    playerAbove.xp - xp + 1;

    document.getElementById("xpToNext").textContent =
    "🎯 " + xpNeeded + " XP needed to reach #" +
    (yourRank - 1);

}



document.getElementById("yourRank").title =
`Your position is based on XP`;

let html = "";

leaderboard.forEach((player,index) => {

let medal = "";

if(index === 0){
    medal = "🥇";
}
else if(index === 1){
    medal = "🥈";
}
else if(index === 2){
    medal = "🥉";
}
else{
    medal = "🏅";
}

html += `

<div class="leaderboard-item ${player.name === "You" ? "your-rank" : ""}">

<h2>
${medal} #${index + 1} ${player.name}
</h2>

<p>
⭐ XP: ${player.xp}
</p>

<p>
🏅 Level:
${
    player.level === "Master" ? "👑 Master" :
    player.level === "Expert" ? "🏆 Expert" :
    player.level === "Intermediate" ? "🥇 Intermediate" :
    player.level === "Starter" ? "🌟 Starter" :
    "🌱 Beginner"
}
</p>

<p>
📈 XP Progress:

<div class="progress-bar">

<div
class="progress-fill"
style="width:${
    player.level === "Master"
    ? 100
    : player.level === "Expert"
    ? ((player.xp - 1000) / 1000) * 100
    : player.level === "Intermediate"
    ? ((player.xp - 500) / 500) * 100
    : player.level === "Starter"
    ? ((player.xp - 100) / 400) * 100
    : (player.xp / 100) * 100
}%">
</div>

</div>

${
    player.level === "Master" ? "MAX LEVEL" :
    player.level === "Expert" ? `${player.xp - 1000} / 1000 XP` :
    player.level === "Intermediate" ? `${player.xp - 500} / 500 XP` :
    player.level === "Starter" ? `${player.xp - 100} / 400 XP` :
    `${player.xp} / 100 XP`
}
</p>

</div>

`;

});

document.getElementById("leaderboardList").innerHTML = html;

</script>

</body>

</html>
