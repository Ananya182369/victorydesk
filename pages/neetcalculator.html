<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VictoryDesk | NEET Score Calculator</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="top-banner">
🧮 VictoryDesk NEET Score Calculator
</div>

<header>

<h1>🧮 NEET Score Calculator</h1>

<p class="hero-text">
Calculate your NEET score instantly.
</p>

<a href="dashboard.html" class="btn">
⬅ Dashboard
</a>

</header>

<section class="container">

<div class="card">

<h2>Enter Your Correct & Incorrect Answers</h2>

<label>Biology Correct</label>
<input type="number" id="bioCorrect" min="0" max="90" value="0">

<label>Biology Incorrect</label>
<input type="number" id="bioWrong" min="0" max="90" value="0">

<label>Chemistry Correct</label>
<input type="number" id="chemCorrect" min="0" max="45" value="0">

<label>Chemistry Incorrect</label>
<input type="number" id="chemWrong" min="0" max="45" value="0">

<label>Physics Correct</label>
<input type="number" id="phyCorrect" min="0" max="45" value="0">

<label>Physics Incorrect</label>
<input type="number" id="phyWrong" min="0" max="45" value="0">

<br><br>

<button class="btn" onclick="calculateScore()">
🧮 Calculate Score
</button>

</div>

<div class="card">

<h2>📊 Your Result</h2>

<p id="scoreResult">
Enter your answers and calculate your score.
</p>

</div>

</section>

<script>

function calculateScore(){

let bioCorrect =
Number(document.getElementById("bioCorrect").value) || 0;

let bioWrong =
Number(document.getElementById("bioWrong").value) || 0;

let chemCorrect =
Number(document.getElementById("chemCorrect").value) || 0;

let chemWrong =
Number(document.getElementById("chemWrong").value) || 0;

let phyCorrect =
Number(document.getElementById("phyCorrect").value) || 0;

let phyWrong =
Number(document.getElementById("phyWrong").value) || 0;

let correct =
bioCorrect + chemCorrect + phyCorrect;

let wrong =
bioWrong + chemWrong + phyWrong;

let score =
(correct * 4) - (wrong * 1);

document.getElementById("scoreResult").innerHTML =
"✅ Correct: " + correct +
"<br>❌ Incorrect: " + wrong +
"<br>⭐ NEET Score: <strong>" + score + " / 720</strong>";

}

</script>

</body>

</html>
