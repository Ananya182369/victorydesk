<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VictoryDesk | MCQs</title>

<link rel="stylesheet" href="../style.css">

<script src="../data/neet.js"></script>
<script src="../data/jee.js"></script>
<script src="../data/cuet.js"></script>

</head>

<body>

<div class="top-banner">
❓ VictoryDesk MCQs
</div>

<header>

<h1 id="pageTitle">Loading...</h1>

<p class="hero-text">
Practice chapter-wise questions and improve your score.
</p>

<a href="javascript:history.back()" class="btn">⬅ Back</a>

</header>

<section class="container">

<h2 class="section-title">
Practice MCQs
</h2>

<p id="questionNumber" class="mcq-question-number">
</p>

<h3 id="question"></h3>

<div id="options"></div>

<br>

<button class="btn" onclick="checkAnswer()">
Submit
</button>

<button class="btn" onclick="nextQuestion()">
Next Question →
</button>

<p id="result" class="mcq-result">
</p>

<p id="score" class="mcq-score">
</p>

</div>

</section>
<script>

const params = new URLSearchParams(window.location.search);

const exam = params.get("exam");
const subject = params.get("subject");

document.getElementById("pageTitle").innerHTML =
exam + " • " + subject + " MCQs";

let currentIndex = 0;
let score = 0;

let questions = [];

let examData = null;

if (exam === "NEET") {
    examData = neetData;
}
else if (exam === "JEE") {
    examData = jeeData;
}
else if (exam === "CUET") {
    examData = cuetData;
}

if (examData) {

    const subjectKey = Object.keys(examData).find(key =>
        subject.includes(key)
    );

    if (subjectKey) {
        questions = examData[subjectKey].mcqs;
    }

}

if(questions.length === 0){

document.querySelector(".card").innerHTML = `
<h2>🚧 Coming Soon</h2>
<p>MCQs for this subject are not available yet.</p>
`;

throw new Error("No MCQs Found");

}

loadQuestion();

function loadQuestion(){

    document.getElementById("questionNumber").innerHTML =
"Question " + (currentIndex + 1) + " / " + questions.length;

document.getElementById("result").innerHTML="";
document.querySelector('button[onclick="checkAnswer()"]').disabled = false;

document.getElementById("question").innerHTML =
questions[currentIndex].question;

let html="";

questions[currentIndex].options.forEach((option,index)=>{

html += `
<label class="mcq-option">

<input type="radio" name="q1" value="${index}">

${option}

</label>
`;

});

document.getElementById("options").innerHTML=html;



}

function checkAnswer(){

const answer=document.querySelector('input[name="q1"]:checked');

if(!answer){

alert("Please select an answer.");

return;

}

if(Number(answer.value)===questions[currentIndex].answer){

document.getElementById("result").innerHTML =
"✅ Correct! 🎉";

score++;

let mcqsSolved =
Number(localStorage.getItem("mcqsSolved")) || 0;

mcqsSolved++;

localStorage.setItem("mcqsSolved", mcqsSolved);

document.getElementById("score").innerHTML =
"🏆 Score: " + score;

document.querySelector('button[onclick="checkAnswer()"]').disabled = true;

document.querySelectorAll('input[name="q1"]').forEach(option=>{
    option.disabled = true;
});

}

else{

document.getElementById("result").innerHTML =
"❌ Wrong! Correct Answer: " +
questions[currentIndex].options[questions[currentIndex].answer];

document.getElementById("score").innerHTML =
"🏆 Score: " + score;


/* ================================
   SAVE FOR ACTIVE RECALL
================================ */

let activeRecallQuestions =
JSON.parse(
localStorage.getItem("activeRecallQuestions")
) || [];

const currentQuestion =
questions[currentIndex];

const alreadyExists =
activeRecallQuestions.some(
item => item.question === currentQuestion.question
);

if(!alreadyExists){

activeRecallQuestions.push({

question: currentQuestion.question,

correctAnswer:
currentQuestion.options[
currentQuestion.answer
]

});

localStorage.setItem(
"activeRecallQuestions",
JSON.stringify(activeRecallQuestions)
);

}


/* ================================
   DISABLE OPTIONS
================================ */

document.querySelectorAll(
'input[name="q1"]'
).forEach(option=>{
    option.disabled = true;
});

}

}

function nextQuestion(){

    const selectedAnswer = document.querySelector('input[name="q1"]:checked');

if(!selectedAnswer){
    alert("Please select and submit an answer first.");
    return;
}

if(currentIndex < questions.length-1){

currentIndex++;

window.scrollTo({
    top: 0,
    behavior: "smooth"
});

document.getElementById("result").innerHTML = "";

loadQuestion();

}

else{

document.querySelector(".card").innerHTML=`

<h2>🎉 Quiz Completed!</h2>

<p>🎯 Great job! Keep practicing to improve your score.</p>

<p>Your Score: ${score} / ${questions.length}</p>

<button class="btn" onclick="location.reload()">

Restart Quiz

</button>

`;

}

}

</script>

</body>
</html>
