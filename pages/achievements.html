<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VictoryDesk | Achievements</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="top-banner">
🏆 VictoryDesk Achievements
</div>

<header>

<h1>Your Achievements</h1>

<p class="hero-text">
Unlock badges by completing your study goals.
</p>

<a href="dashboard.html" class="btn">
⬅ Dashboard
</a>

</header>

<section class="container">

<div id="badgeContainer"></div>

</section>

<script src="data/badges.js"></script>

<script>

let html = "";

let unlockedCount = 0;

if(localStorage.getItem("firstMockCompleted")){
    
    // XP + Streak Based Unlock System

let xp =
Number(localStorage.getItem("xp")) || 0;

let streak =
Number(localStorage.getItem("studyStreak")) || 0;


// First Mock
if(localStorage.getItem("firstMockCompleted")){
    badges[0].unlocked = true;
}


// 7 Day Streak
if(streak >= 7){
    badges[1].unlocked = true;
}


// XP Champion
if(xp >= 500){
    badges[5].unlocked = true;
}


// Victory Champion
let unlockedBadges = badges.filter(
item => item.unlocked
).length;


if(unlockedBadges === badges.length - 1){
    badges[5].unlocked = true;
}

badges[0].unlocked = true;

}

badges.forEach(item=>{

    if(item.unlocked){
    unlockedCount++;
}

html += `

<div class="card">

<h2>${item.icon} ${item.title}</h2>

<p>${item.description}</p>

<p>

${item.unlocked ? "✅ Unlocked" : "🔒 Locked"}

</p>

</div>

`;

});

document.getElementById("badgeContainer").innerHTML = html;

html =
`
<div class="card">

<h2>🏆 Achievement Summary</h2>

<p>
Unlocked Badges: ${unlockedCount} / ${badges.length}
</p>

</div>
`
+ html;

</script>

</body>

</html>
