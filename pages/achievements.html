<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VictoryDesk | Achievements</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="top-banner">
🏆 VictoryDesk Achievements
</div>

<header>

<h1>Your Achievements</h1>

<p class="hero-text">
Unlock badges by completing your study goals.
</p>

<a href="dashboard.html" class="btn">
⬅ Dashboard
</a>

</header>

<section class="container">

<div class="achievements-section">

<div class="card achievement-stats">

<h2>📊 Your Achievement Progress</h2>

<p id="achievementProgress">
0 / 0 Unlocked
</p>

<div class="progress-box">

    <div class="progress-header">
        <span>Badge Progress</span>
        <span id="achievementPercent">0%</span>
    </div>

    <div class="progress-bar">
        <div
            id="achievementProgressFill"
            class="progress-fill">
        </div>
    </div>

</div>

</div>

<div id="badgeContainer"></div>

</div>

</section>

<script src="../data/badges.js"></script>

<script>

let html = "";

let unlockedCount = 0;

const savedBadges =
    JSON.parse(localStorage.getItem("unlockedBadges")) || [];

badges.forEach(badge => {
    badge.unlocked =
        savedBadges.includes(badge.title);
});
    
    // XP + Streak Based Unlock System

let xp =
Number(localStorage.getItem("xp")) || 0;

let streak =
Number(localStorage.getItem("studyStreak")) || 0;


// First Mock
if(localStorage.getItem("firstMockCompleted")){
    badges[0].unlocked = true;
}


// 7 Day Streak
if(streak >= 7){
    badges[1].unlocked = true;
}

// 100 MCQs Solved
let mcqsSolved =
Number(localStorage.getItem("mcqsSolved")) || 0;

if(mcqsSolved >= 100){
    badges[2].unlocked = true;
}

// Chapter Master
if(localStorage.getItem("chapterMaster")){
    badges[3].unlocked = true;
}

// Early Bird
const studyHour = new Date().getHours();

if(studyHour < 8){
    badges[4].unlocked = true;
}

// Victory Champion
if(
    badges[0].unlocked &&
    badges[1].unlocked &&
    badges[2].unlocked &&
    badges[3].unlocked &&
    badges[4].unlocked
){
    badges[5].unlocked = true;
}

const unlockedBadges = badges
    .filter(badge => badge.unlocked)
    .map(badge => badge.title);

let rewardedBadges =
    JSON.parse(localStorage.getItem("rewardedBadges")) || [];

badges.forEach(badge => {

    if(
        badge.unlocked &&
        badge.reward &&
        !rewardedBadges.includes(badge.title)
    ){

        xp += badge.reward;

        rewardedBadges.push(badge.title);

    }

});

localStorage.setItem("xp", xp);

localStorage.setItem(
    "rewardedBadges",
    JSON.stringify(rewardedBadges)
);

localStorage.setItem(
    "unlockedBadges",
    JSON.stringify(unlockedBadges)
);

html += `<div class="achievement-grid">`;

badges.forEach(item=>{

    if(item.unlocked){
    unlockedCount++;
}

html += `

<div class="card ${item.unlocked ? "badge-unlocked" : "badge-locked"}">

<h2>${item.icon} ${item.title}</h2>

<p>${item.description}</p>

<p>

${item.unlocked ? "✅ Unlocked" : "🔒 Locked"}

</p>

<p>
⭐ Reward: ${item.reward || 0} XP
</p>

<p>
${
    item.unlocked
    ? "🎉 Achievement unlocked!"
    : "🔒 Keep studying to unlock"
}
</p>

</div>

`;

});

html += `</div>`;

html =
`
<div class="card achievement-summary">

<h2>🏆 Achievement Summary</h2>

<p>
Unlocked Badges: ${unlockedCount} / ${badges.length}
</p>

<p>
⭐ Badge XP Earned:
${badges
    .filter(badge => badge.unlocked)
    .reduce((total, badge) => total + (badge.reward || 0), 0)}
XP
</p>

<p id="totalAchievementXP">
⭐ Total XP: 0
</p>

</div>
`
+ html;

const badgePercent = Math.round(
    (unlockedCount / badges.length) * 100
);

document.getElementById("achievementProgress").textContent =
`${unlockedCount} / ${badges.length} Unlocked`;

document.getElementById("achievementPercent").textContent =
badgePercent + "%";

setTimeout(() => {
    document.getElementById("achievementProgressFill").style.width =
    badgePercent + "%";
}, 300);

document.getElementById("badgeContainer").innerHTML = html;

document.getElementById("totalAchievementXP").textContent =
"⭐ Total XP: " +
(Number(localStorage.getItem("xp")) || 0);

</script>

</body>

</html>
