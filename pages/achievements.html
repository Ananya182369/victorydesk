<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VictoryDesk | Achievements</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="top-banner">
🏆 VictoryDesk Achievements
</div>

<header>

<h1>Your Achievements</h1>

<p class="hero-text">
Unlock badges by completing your study goals.
</p>

<a href="dashboard.html" class="btn">
⬅ Dashboard
</a>

</header>

<section class="container">

<div id="badgeContainer"></div>

</section>

<script src="../data/badges.js"></script>

<script>

let html = "";

let unlockedCount = 0;

if(localStorage.getItem("firstMockCompleted")){
    
    // XP + Streak Based Unlock System

let xp =
Number(localStorage.getItem("xp")) || 0;

let streak =
Number(localStorage.getItem("studyStreak")) || 0;


// First Mock
if(localStorage.getItem("firstMockCompleted")){
    badges[0].unlocked = true;
}


// 7 Day Streak
if(streak >= 7){
    badges[1].unlocked = true;
}

// 100 MCQs Solved
let mcqsSolved =
Number(localStorage.getItem("mcqsSolved")) || 0;

if(mcqsSolved >= 100){
    badges[2].unlocked = true;
}

// Chapter Master
if(localStorage.getItem("chapterMaster")){
    badges[3].unlocked = true;
}

// Early Bird
const studyHour = new Date().getHours();

if(studyHour < 8){
    badges[4].unlocked = true;
}

// Victory Champion
if(
    badges[0].unlocked &&
    badges[1].unlocked &&
    badges[2].unlocked &&
    badges[3].unlocked &&
    badges[4].unlocked
){
    badges[5].unlocked = true;
}

// Victory Champion
let unlockedBadges = badges.filter(
item => item.unlocked
).length;


if(unlockedBadges === badges.length - 1){
    badges[5].unlocked = true;
}


}

badges.forEach(item=>{

    if(item.unlocked){
    unlockedCount++;
}

html += `

<div class="card">

<h2>${item.icon} ${item.title}</h2>

<p>${item.description}</p>

<p>

${item.unlocked ? "✅ Unlocked" : "🔒 Locked"}

</p>

</div>

`;

});




html =
`
<div class="card">

<h2>🏆 Achievement Summary</h2>

document.getElementById("badgeContainer").innerHTML = html;

<p>
Unlocked Badges: ${unlockedCount} / ${badges.length}
</p>

</div>
`
+ html;

document.getElementById("badgeContainer").innerHTML = html;

</script>

</body>

</html>
