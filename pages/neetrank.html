<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VictoryDesk | NEET Rank Predictor</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="top-banner">
🏆 VictoryDesk NEET Rank Predictor
</div>

<header>

<h1>🏆 NEET Rank Predictor</h1>

<p class="hero-text">
Get an estimated NEET rank range from your score.
</p>

<a href="dashboard.html" class="btn">
⬅ Dashboard
</a>

</header>

<section class="container">

<div class="card">

<h2>Enter Your NEET Score</h2>

<input
type="number"
id="neetScore"
min="0"
max="720"
placeholder="Enter score (0 - 720)"
>

<br><br>

<button class="btn" onclick="predictRank()">
🔮 Predict Rank
</button>

</div>

<div class="card">

<h2>📊 Estimated Result</h2>

<p id="rankResult">
Enter your score to see an estimated rank range.
</p>

</div>

</section>

<script>

function predictRank(){

let score =
Number(document.getElementById("neetScore").value);

let result = "";

if(isNaN(score) || score < 0 || score > 720){

result = `
<h3>⚠️ Invalid Score</h3>
<p>Please enter a NEET score between 0 and 720.</p>
`;

}

else if(score >= 650){

result = `
<h3>🏆 Excellent Score Range</h3>

<p><strong>Score:</strong> ${score}</p>

<hr>

<p>🔢 Estimated Rank Range:</p>
<h2>1 – 5,000</h2>

<p>🎯 Very competitive score range.</p>
`;

}

else if(score >= 600){

result = `
<h3>🥇 Strong Score Range</h3>

<p><strong>Score:</strong> ${score}</p>

<hr>

<p>🔢 Estimated Rank Range:</p>
<h2>5,000 – 25,000</h2>

<p>🎯 Strong rank potential.</p>
`;

}

else if(score >= 550){

result = `
<h3>🥈 Good Score Range</h3>

<p><strong>Score:</strong> ${score}</p>

<hr>

<p>🔢 Estimated Rank Range:</p>
<h2>25,000 – 60,000</h2>

<p>📚 College options will depend on counselling, category and state.</p>
`;

}

else if(score >= 500){

result = `
<h3>🥉 Moderate Score Range</h3>

<p><strong>Score:</strong> ${score}</p>

<hr>

<p>🔢 Estimated Rank Range:</p>
<h2>60,000 – 1,20,000</h2>

<p>📚 Check state and category-wise counselling options.</p>
`;

}

else if(score >= 450){

result = `
<h3>📚 Lower Score Range</h3>

<p><strong>Score:</strong> ${score}</p>

<hr>

<p>🔢 Estimated Rank Range:</p>
<h2>1,20,000 – 2,00,000</h2>

<p>🎯 Explore available counselling and alternative options.</p>
`;

}

else if(score >= 400){

result = `
<h3>📖 Lower Score Range</h3>

<p><strong>Score:</strong> ${score}</p>

<hr>

<p>🔢 Estimated Rank Range:</p>
<h2>2,00,000 – 3,00,000</h2>

<p>📚 Check available courses and counselling opportunities.</p>
`;

}

else{

result = `
<h3>🌱 Limited Rank Range</h3>

<p><strong>Score:</strong> ${score}</p>

<hr>

<p>🔢 Estimated Rank:</p>
<h2>3,00,000+</h2>

<p>📚 Consider exploring other medical and allied-health courses.</p>
`;

}

document.getElementById("rankResult").innerHTML =
result;

}

</script>

</body>

</html>
