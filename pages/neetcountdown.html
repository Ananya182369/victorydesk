<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VictoryDesk | NEET Countdown</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="top-banner">
⏳ VictoryDesk NEET Countdown
</div>

<header>

<h1>⏳ NEET Exam Countdown</h1>

<p class="hero-text">
Track the remaining time and stay consistent with your preparation.
</p>

<a href="dashboard.html" class="btn">
⬅ Dashboard
</a>

</header>

<section class="container">

<div class="card">

<h2>📅 NEET Exam Date</h2>

<input
type="date"
id="examDate"
>

<br><br>

<button class="btn" onclick="startCountdown()">
⏳ Start Countdown
</button>

</div>

<div class="card">

<h2>🔥 Time Remaining</h2>

<div id="countdown">

Enter your exam date above.

</div>

</div>

</section>

<script>

let countdownTimer;

function startCountdown(){

const dateInput =
document.getElementById("examDate").value;

if(!dateInput){

document.getElementById("countdown").innerHTML =
"⚠️ Please select your exam date.";

return;

}

const examDate =
new Date(dateInput + "T00:00:00");

clearInterval(countdownTimer);

function updateCountdown(){

const now = new Date();

const difference =
examDate - now;

if(difference <= 0){

clearInterval(countdownTimer);

document.getElementById("countdown").innerHTML =
"🎯 Exam date has arrived!";

return;

}

const days =
Math.floor(
difference / (1000 * 60 * 60 * 24)
);

const hours =
Math.floor(
(difference / (1000 * 60 * 60)) % 24
);

const minutes =
Math.floor(
(difference / (1000 * 60)) % 60
);

const seconds =
Math.floor(
(difference / 1000) % 60
);

document.getElementById("countdown").innerHTML =

`
<h2>🔥 ${days} Days</h2>

<p>
⏰ ${hours} Hours
</p>

<p>
⏱️ ${minutes} Minutes
</p>

<p>
⌛ ${seconds} Seconds
</p>
`;

}

updateCountdown();

countdownTimer =
setInterval(updateCountdown, 1000);

}

</script>

</body>

</html>
