<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VictoryDesk | NEET College Predictor</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="top-banner">
🏫 VictoryDesk NEET College Predictor
</div>

<header>

<h1>🏫 NEET College Predictor</h1>

<p class="hero-text">
Explore estimated college options based on your NEET score.
</p>

<a href="dashboard.html" class="btn">
⬅ Dashboard
</a>

</header>

<section class="container">

<div class="card">

<h2>Enter Your Details</h2>

<label>NEET Score</label>

<input
type="number"
id="neetScore"
min="0"
max="720"
placeholder="Enter score"
>

<br><br>

<label>Category</label>

<select id="category">

<option value="General">General</option>
<option value="OBC">OBC</option>
<option value="SC">SC</option>
<option value="ST">ST</option>

</select>

<br><br>

<button class="btn" onclick="predictCollege()">
🏫 Find Colleges
</button>

</div>

<div class="card">

<h2>📊 Estimated Options</h2>

<div id="collegeResult">

Enter your score and category to see estimated options.

</div>

</div>

</section>

<script>

function predictCollege(){

let score =
Number(document.getElementById("neetScore").value);

let category =
document.getElementById("category").value;

let result = "";

if(isNaN(score) || score < 0 || score > 720){

result = `
<h3>⚠️ Invalid Score</h3>
<p>Please enter a NEET score between 0 and 720.</p>
`;

}

else if(score >= 650){

result = `
<h3>🏆 Excellent Score Range</h3>

<p><strong>Score:</strong> ${score}</p>
<p><strong>Category:</strong> ${category}</p>

<hr>

<h4>Possible Options</h4>

<ul>
<li>Top government medical colleges</li>
<li>Highly competitive state quota colleges</li>
<li>Strong private medical colleges</li>
</ul>

<p>🎯 Final college options depend on counselling, rank, state quota and category.</p>
`;

}

else if(score >= 550){

result = `
<h3>🥇 Good Score Range</h3>

<p><strong>Score:</strong> ${score}</p>
<p><strong>Category:</strong> ${category}</p>

<hr>

<h4>Possible Options</h4>

<ul>
<li>Government medical colleges depending on state and category</li>
<li>State counselling opportunities</li>
<li>Private medical colleges</li>
</ul>

<p>🎯 Check your counselling eligibility before making a choice.</p>
`;

}

else if(score >= 450){

result = `
<h3>🥈 Moderate Score Range</h3>

<p><strong>Score:</strong> ${score}</p>
<p><strong>Category:</strong> ${category}</p>

<hr>

<h4>Possible Options</h4>

<ul>
<li>Selected state quota opportunities</li>
<li>Private medical colleges</li>
<li>Other medical and allied-health courses</li>
</ul>

<p>📚 Actual options depend heavily on counselling and category.</p>
`;

}

else if(score >= 350){

result = `
<h3>📚 Lower Score Range</h3>

<p><strong>Score:</strong> ${score}</p>
<p><strong>Category:</strong> ${category}</p>

<hr>

<h4>Possible Options</h4>

<ul>
<li>Private colleges depending on counselling</li>
<li>Alternative medical courses</li>
<li>Allied-health courses</li>
</ul>

`;

}

else{

result = `
<h3>🌱 Limited MBBS Options</h3>

<p><strong>Score:</strong> ${score}</p>
<p><strong>Category:</strong> ${category}</p>

<hr>

<h4>Consider Exploring</h4>

<ul>
<li>Alternative medical courses</li>
<li>Allied-health courses</li>
<li>State counselling opportunities</li>
</ul>

`;

}

document.getElementById("collegeResult").innerHTML =
result;

}

</script>

</body>

</html>
