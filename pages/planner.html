<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VictoryDesk | Study Planner</title>
<link rel="stylesheet" href="../style.css">
</head>

<body>

<div class="top-banner">
📅 VictoryDesk Study Planner
</div>

<header>

<h1 id="plannerTitle">Study Planner</h1>

<p class="hero-text" id="plannerSubtitle">
Plan your daily study schedule.
</p>

<a href="dashboard.html" class="btn">⬅ Dashboard</a>

</header>

<section class="container planner-page">

<div class="card">

<h2>🎯 Today's Plan</h2>

<input 
type="text"
id="customTask"
class="contact-input"
placeholder="➕ Add your own task">

<button class="btn" onclick="addTask()">
Add Task
</button>

<div class="custom-tasks-section">

<h3>📌 Custom Tasks</h3>

<div id="customTasks"></div>

</div>

<label>
<input type="checkbox" id="task1">
📖 Study 1 Chapter
</label>



<label>
<input type="checkbox" id="task2">
❓ Solve 20 MCQs
</label>



<label>
<input type="checkbox" id="task3">
🧪 Attempt 1 Mock Test
</label>



<button class="btn" onclick="saveTasks()">
💾 Save Progress
</button>

<div class="goal-summary">

<h3>🎯 Goal Summary</h3>

<p>
Total Goals: <span id="totalGoals">3</span>
</p>

<p>
Completed Goals: <span id="completedGoals">0</span>
</p>

</div>

<div class="planner-progress-section">

<h3>📊 Today's Progress</h3>

<div id="plannerProgress" class="planner-progress"></div>

<p id="plannerText">
0% Completed
</p>

</div>

<div class="revision-section">

<h3>🔁 Revision Tracker</h3>

<label>
<input type="checkbox" id="revision1">
📖 Revise Chapter Notes
</label>

<label>
<input type="checkbox" id="revision2">
❓ Revise Important MCQs
</label>

<label>
<input type="checkbox" id="revision3">
📝 Revise Previous Mistakes
</label>

<p id="revisionProgress">
0/3 Revision Completed
</p>

</div>

</div>

</div>

</section>

<script>

const params = new URLSearchParams(window.location.search);

const exam = params.get("exam");
const subject = params.get("subject");

if (exam && subject) {

    document.getElementById("plannerTitle").innerHTML =
        "📅 " + exam + " • " + subject;

    document.getElementById("plannerSubtitle").innerHTML =
        "Create your study plan for this subject.";

    localStorage.setItem("plannerExam", exam);
    localStorage.setItem("plannerSubject", subject);

}

document.getElementById("task1").checked =
localStorage.getItem("task1") === "true";

document.getElementById("task2").checked =
localStorage.getItem("task2") === "true";

document.getElementById("task3").checked =
localStorage.getItem("task3") === "true";

document.getElementById("revision1").checked =
localStorage.getItem("revision1") === "true";

document.getElementById("revision2").checked =
localStorage.getItem("revision2") === "true";

document.getElementById("revision3").checked =
localStorage.getItem("revision3") === "true";

function saveTasks(){

localStorage.setItem("task1",
document.getElementById("task1").checked);

localStorage.setItem(
"lastPlannerUpdate",
new Date().toDateString()
);

localStorage.setItem("task2",
document.getElementById("task2").checked);

localStorage.setItem("task3",
document.getElementById("task3").checked);

alert("✅ Study plan saved!");

localStorage.setItem(
"revision1",
document.getElementById("revision1").checked
);

localStorage.setItem(
"revision2",
document.getElementById("revision2").checked
);

localStorage.setItem(
"revision3",
document.getElementById("revision3").checked
);

updateProgress();

}

function addTask(){

let task =
document.getElementById("customTask").value;

if(task === ""){
alert("Enter a task");
return;
}

let tasks =
JSON.parse(localStorage.getItem("customTasks")) || [];

tasks.push(task);

localStorage.setItem(
"customTasks",
JSON.stringify(tasks)
);

showTasks();

document.getElementById("customTask").value="";

}


function showTasks(){

let tasks =
JSON.parse(localStorage.getItem("customTasks")) || [];

let html="";

tasks.forEach(task=>{

html += `
<p>📌 ${task}</p>
`;

});

document.getElementById("customTasks").innerHTML = html;

}

showTasks();

function updateProgress(){

let completed = 0;

let revisionCompleted = 0;

if(document.getElementById("revision1").checked)
revisionCompleted++;

if(document.getElementById("revision2").checked)
revisionCompleted++;

if(document.getElementById("revision3").checked)
revisionCompleted++;

document.getElementById("revisionProgress").innerHTML =
revisionCompleted + "/3 Revision Completed";

if(document.getElementById("task1").checked)
completed++;

if(document.getElementById("task2").checked)
completed++;

if(document.getElementById("task3").checked)
completed++;

let percent = (completed / 3) * 100;

document.getElementById("totalGoals").innerHTML = 3;

document.getElementById("completedGoals").innerHTML =
completed;

document.getElementById("plannerProgress").style.width =
percent + "%";

document.getElementById("plannerText").innerHTML =
percent + "% Completed";

}

updateProgress();

</script>

</body>
</html>
